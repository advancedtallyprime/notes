<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Prime (Advanced)</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
<style>
/* ==========================================================================
   Light Blue Minimal Theme CSS
   ========================================================================== */

/* 1. CSS Custom Properties (Variables) */
:root {
  --bg-main: #f4f8fb;
  --bg-card: #ffffff;
  --bg-card-hover: #eef6fc;
  --text-primary: #1e293b;
  --text-muted: #64748b;
  
  --primary-blue: #0284c7;
  --primary-light: #e0f2fe;
  --primary-hover: #0369a1;
  --border-color: #e2e8f0;
  
  --radius: 8px;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(2, 132, 199, 0.08);
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 2. Global Resets & Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* 3. Header Styling */
.main-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.main-header .logo {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--primary-blue);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.nav-toggle {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 0.4rem 0.75rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1.1rem;
  transition: var(--transition);
}

.nav-toggle:hover {
  background-color: var(--primary-light);
  color: var(--primary-blue);
  border-color: var(--primary-light);
}

/* 4. Layout Container */
.container {
  max-width: 800px;
  width: 90%;
  margin: 2rem auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

/* 5. Accordion (<details> & <summary>) */
details {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}

details[open] {
  border-color: #bae6fd;
  box-shadow: var(--shadow-md);
}

summary {
  padding: 1rem 1.25rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  list-style: none; /* Hide default arrow */
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  transition: var(--transition);
}

/* Custom expand/collapse indicator (+) */
summary::after {
  content: "+";
  font-size: 1.2rem;
  font-weight: 400;
  color: var(--primary-blue);
  transition: transform 0.2s ease;
}

details[open] summary::after {
  content: "−";
}

summary:hover {
  background-color: var(--bg-card-hover);
  color: var(--primary-blue);
}

details[open] summary {
  border-bottom: 1px solid var(--border-color);
  background-color: #f0f9ff;
  color: var(--primary-hover);
}

/* 6. Module Topics List */
details ul {
  list-style: none;
  padding: 0.5rem 0;
  background-color: var(--bg-card);
}

details li a {
  display: block;
  padding: 0.65rem 1.5rem;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.95rem;
  transition: var(--transition);
  position: relative;
}

details li a:hover {
  color: var(--primary-blue);
  background-color: var(--bg-card-hover);
  padding-left: 1.75rem; /* Subtle indent effect on hover */
}

/* 7. Footer Styling */
.notes-footer {
  background-color: var(--bg-card);
  border-top: 1px solid var(--border-color);
  text-align: center;
  padding: 1.25rem 1rem;
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-top: auto;
}

.notes-footer strong {
  color: var(--text-primary);
}

/* 8. Mobile Responsiveness */
@media (max-width: 640px) {
  .container {
    width: 95%;
    margin: 1rem auto;
  }

  summary {
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
  }

  details li a {
    padding: 0.6rem 1.25rem;
  }
}
</style>
</head>

<body>

<header class="main-header">
  
     <a href="/" class="logo">Tally Prime (Advanced)</a>
</header>

    <div class="container" id="courseModules"></div>

<footer class="notes-footer">
    <p>© 2025 GTEC Jain Keerti Education | Notes Prepared by <strong>Anas Sir</strong></p>
</footer>

    <script src="/TallyPrime/scripts/Acourse-data.js"></script>

    <script>
        const container = document.getElementById("courseModules");

        advancedTallyCourse.forEach(module => {

            const details = document.createElement("details");

            let topics = "";

            module.topics.forEach(topic => {

                topics += `
                    <li>
                        <a href="/TallyPrime/advance-tally/${module.folder}/${topic}.html">
                            ${topic.replaceAll("-", " ")}
                        </a>
                    </li>
                `;
            });

            details.innerHTML = `
                <summary>${module.module}</summary>
                <ul>
                    ${topics}
                </ul>
            `;

            container.appendChild(details);

        });
    </script>

</body>
</html>
